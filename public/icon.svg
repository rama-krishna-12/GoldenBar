<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#082F49" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Subtle glow/ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38BDF8" stroke-width="4" opacity="0.3"/>

  <!-- Main Fitness / Dumbbell Graphic in safe zone -->
  <g filter="url(#dropShadow)" transform="translate(256, 256) rotate(-25) translate(-256, -256)">
    <!-- Dumbbell Bar -->
    <rect x="180" y="244" width="152" height="24" rx="12" fill="url(#metalGrad)"/>
    <rect x="226" y="240" width="60" height="32" rx="6" fill="#F1F5F9" opacity="0.8"/>

    <!-- Left Weight Plates -->
    <rect x="150" y="196" width="24" height="120" rx="8" fill="#F8FAFC"/>
    <rect x="124" y="212" width="20" height="88" rx="6" fill="#E2E8F0"/>
    <rect x="106" y="226" width="14" height="60" rx="4" fill="#CBD5E1"/>

    <!-- Right Weight Plates -->
    <rect x="338" y="196" width="24" height="120" rx="8" fill="#F8FAFC"/>
    <rect x="368" y="212" width="20" height="88" rx="6" fill="#E2E8F0"/>
    <rect x="392" y="226" width="14" height="60" rx="4" fill="#CBD5E1"/>

    <!-- Energy Sparkle Accent -->
    <circle cx="370" cy="170" r="12" fill="#FDE047"/>
    <circle cx="140" cy="340" r="8" fill="#38BDF8"/>
  </g>

  <!-- GoldenBar Monogram Emblem at bottom center of safe zone -->
  <g transform="translate(256, 420)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="38" fill="#FBBF24" letter-spacing="4">GOLDENBAR</text>
  </g>
</svg>
